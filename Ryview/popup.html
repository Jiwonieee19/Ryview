<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Review Detector</title>
  <style>
    body {
      width: 260px;
      margin: 0;
      padding: 16px;
      font-family: Segoe UI, Arial, sans-serif;
      background: #110D1A;
      color: #EAE6F0;
    }
    h3 {
      margin: 0 0 14px;
      font-size: 18px;
    }
    button {
      width: 100%;
      border: 0;
      border-radius: 10px;
      padding: 10px 12px;
      background: #9B6DFF;
      color: #fff;
      font-weight: 700;
      cursor: pointer;
    }
    #result {
      margin: 12px 0 0;
      min-height: 20px;
      font-size: 13px;
      line-height: 1.4;
      color: #C9C2D8;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h3>Hotel Review Detector</h3>
  <button id="check">Check Selected Review</button>
  <p id="result"></p>
  <script src="popup.js"></script>
</body>
</html>
